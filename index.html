<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deep Tide</title>
<style>
  :root {
    --bg: #02070d;
    --panel: rgba(6, 22, 36, 0.78);
    --line: rgba(140, 210, 230, 0.18);
    --text: #d6eef5;
    --dim: #7fa6b5;
    --accent: #5fd4d0;
    --danger: #ff6b8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); padding: 10px 12px; }
  #title { top: 12px; left: 12px; }
  #title h1 { margin: 0; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  #title p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
  #stats { top: 12px; right: 12px; width: 230px; }
  #stats h2, #log h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row .n { margin-left: auto; font-variant-numeric: tabular-nums; }
  .row.extinct { opacity: .45; }
  .row.extinct .n::after { content: " ✕"; color: var(--danger); }
  .row .nm { white-space: nowrap; }
  .row .spark { flex: 1 1 0; min-width: 0; height: 14px; margin-left: 4px; } /* shrinks away before a count is pushed out */
  .row .n { min-width: 3ch; text-align: right; }
  .ghost { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 0 8px; opacity: .55; filter: grayscale(1); }
  .ghost img { height: 18px; width: auto; }
  #bio { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; }
  #bio b { color: var(--text); font-weight: 600; }
  #log { top: 12px; left: 50%; transform: translateX(-50%); width: min(420px, 40vw); pointer-events: none; background: none; border: none; backdrop-filter: none; text-align: center; }
  #log div { margin: 2px 0; text-shadow: 0 1px 4px #000; transition: opacity 1.5s; }
  #log .warn { color: var(--danger); }
  #log .good { color: var(--accent); }
  #bar { bottom: 12px; left: 50%; transform: translateX(-50%); width: max-content; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
  button { background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { border-color: var(--accent); background: rgba(95,212,208,.18); }
  button.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(95,212,208,.35); border-color: var(--accent); } }
  button.harm.on { border-color: var(--danger); background: rgba(255,107,138,.18); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  label.s { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  input[type=range] { width: 90px; accent-color: var(--accent); }
  select { background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font: inherit; }
  #hint { flex-basis: 100%; text-align: center; color: var(--dim); font-size: 12px; min-height: 17px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:disabled:hover { background: rgba(255,255,255,.05); }
  input:disabled { opacity: .7; }
  /* scored run HUD (inside the title panel) */
  #hud { width: min(230px, 44vw); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 7px; font-size: 12px; }
  #hud[hidden] { display: none; }
  #hud .clock { display: flex; justify-content: space-between; align-items: baseline; }
  #hud .clock b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #hud .clock small { color: var(--dim); font-size: 11px; }
  #hud .q { display: flex; justify-content: space-between; color: var(--dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  #hud .q b { color: var(--text); font-weight: 600; }
  .qbar { height: 8px; margin-top: 3px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
  .qbar i { display: block; height: 100%; width: 0; background: #e0a84c; transition: width .3s; }
  .qbar.met i { background: var(--accent); }
  #hud .sub { color: var(--dim); margin-top: 5px; }
  #hud .sub .warn { color: var(--danger); }
  /* mode picker + end screen */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(1, 6, 12, .55); }
  .overlay[hidden] { display: none; }
  .card { background: rgba(6, 22, 36, .94); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; width: 100%; max-width: 520px;
    max-height: calc(100vh - 32px); overflow-y: auto; touch-action: pan-y; user-select: text; }
  .card h2 { margin: 0 0 4px; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  .card p { margin: 6px 0; color: var(--dim); }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  #menu .card { max-width: 660px; }
  .modes button.first { border-color: var(--accent); }
  .modes button.first b::after { content: "Start here"; margin-left: 8px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  /* coach: tutorial steps and hints, above the tool bar */
  #coach { left: 50%; transform: translateX(-50%); width: min(460px, calc(100vw - 24px)); z-index: 5; font-size: 13px; }
  #coach .ch { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  #coach p { margin: 4px 0; }
  #coach .task { color: var(--text); font-weight: 600; }
  #coach .prog { color: var(--dim); font-variant-numeric: tabular-nums; }
  #coach .steps { display: flex; flex-wrap: wrap; gap: 2px 12px; list-style: none; padding: 0; margin: 8px 0 0; color: var(--dim); font-size: 11px; }
  #coach .steps li::before { content: "· "; }
  #coach .steps li.done { color: var(--accent); } #coach .steps li.done::before { content: "✓ "; }
  #coach .steps li.now { color: var(--text); } #coach .steps li.now::before { content: "▸ "; }
  #coach .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #coach .actions button { padding: 5px 10px; }
  .modes button { text-align: left; padding: 12px; line-height: 1.35; }
  .modes button b { display: block; font-size: 14px; margin-bottom: 4px; }
  .modes button span { color: var(--dim); font-size: 12px; }
  .verdict { color: var(--text) !important; font-size: 14px; font-style: italic; }
  .bigscore { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 8px 0 2px; }
  .card table { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
  .card td { padding: 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .card td:last-child { text-align: right; padding-left: 10px; }
  .card td.neg { color: var(--danger); }
  .card h3 { margin: 12px 0 2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .card .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .card .actions[hidden] { display: none; }
  @media (max-width: 760px) { #bio, #title p { display: none; } #stats { width: 160px; } #log { left: 12px; transform: none; width: calc(100vw - 196px); text-align: left; font-size: 12px; } }
  @media (max-width: 760px) { #hud .clock small { display: none; } #hud .clock { flex-wrap: wrap; gap: 0 8px; } }
  @media (max-width: 640px) { .modes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="title"><h1>Deep Tide</h1><p id="tagline">A small ocean that runs without you.</p>
  <div id="hud" hidden>
    <div class="clock"><span><b id="hudClock">0:00</b> <small id="hudDur">/ 10:00</small></span><span id="hudMin">Minute 1/10</span></div>
    <div class="q"><span>Quota</span><span><b id="hudHaul">0</b> / <span id="hudDemand">0</span></span></div>
    <div class="qbar" id="hudBar"><i></i></div>
    <div class="sub" id="hudSub"></div>
  </div>
</div>

<div class="panel" id="stats">
  <h2>Life in the water</h2>
  <div id="rows"></div>
  <div id="bio"><span>Biodiversity <b id="bioN">–</b></span><span>Water <b id="waterN">–</b></span></div>
</div>

<div class="panel" id="log"></div>
<div class="panel" id="coach" hidden></div>

<div class="panel" id="bar">
  <div id="hint"></div>
  <button data-tool="watch" class="on">Watch</button>
  <button data-tool="net" class="harm">Net</button>
  <button data-tool="trawl" class="harm">Trawler</button>
  <button data-tool="pollute" class="harm">Pollute</button>
  <button data-tool="invader" class="harm">Release invader</button>
  <button data-tool="stock">Stock</button>
  <select id="stockSel" title="Species to stock"></select>
  <span class="sep"></span>
  <label class="s">Warmth <input type="range" id="temp" min="0" max="100" value="50"></label>
  <span class="sep"></span>
  <button id="hintsBtn" title="Hints (H)" aria-pressed="true">Hints</button>
  <button id="pause">Pause</button>
  <button id="speed">1×</button>
  <button id="reset">Reset</button>
  <button id="menuBtn">Menu</button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h2>Deep Tide</h2>
    <p>A small ocean that runs without you. How much of it do you take?</p>
    <div class="modes">
      <button data-mode="learn"><b>Learn to play</b><span>Five short steps: what lives here, the net, the trawler, the quota, the ballast ship.</span></button>
      <button data-mode="sandbox"><b>Sandbox</b><span>No clock, no score. Watch, meddle, break it, stock it back.</span></button>
      <button data-mode="run"><b>Anthropocene run</b><span>Ten minutes. A fleet that needs more fish every minute, and water that keeps warming.</span></button>
    </div>
    <div class="actions" id="menuBack" hidden><button>Back</button></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card" id="endCard"></div>
</div>

<script src="sim.js"></script>
<script src="sprites.js"></script>
<script src="render.js"></script>
<script src="coach.js"></script>
<script src="ui.js"></script>
</body>
</html>
